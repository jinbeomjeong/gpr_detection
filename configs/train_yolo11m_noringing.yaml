# Copy of configs/train_yolo11m_base.yaml with ringing disabled (probability 0).
# Everything else identical so the ablation differs only in ringing.
model: yolo11m.yaml
dataset_dir: data/aihub_yolo_v1
fold: 0

ultralytics:
  task: detect
  pretrained: false
  imgsz: 256
  epochs: 3
  batch: 32
  workers: 2
  seed: 0
  deterministic: true
  cache: false
  plots: true
  fliplr: 0.5
  flipud: 0.0
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  translate: 0.1
  scale: 0.2
  mosaic: 0.0
  close_mosaic: 0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.3
  bgr: 0.0
  multi_scale: 0.0
  rect: false

gpr_augment:
  strength: 1.0
  gaussian_noise:
    probability: 0.3
    sigma_min: 0.02
    sigma_max: 0.05
  contrast_gamma:
    probability: 0.3
    contrast_max_delta: 0.15
    gamma_max_delta: 0.15
  ringing:
    probability: 0.0
    amplitude_min: 0.01
    amplitude_max: 0.03
    period_min_px: 6.0
    period_max_px: 24.0
  trace_dropout:
    probability: 0.3
    fraction_min: 0.01
    fraction_max: 0.05
    fill: mean
