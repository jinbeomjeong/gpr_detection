# gpr-label: Label Studio 전용 env (gpr-dataset-curator). 고정 의존이 많으니 다른 패키지를 넣지 않는다.
# 근거: docs/research/packages_agents.md (2026-10-29)
# 생성: conda env create -f envs/gpr-label.yml
# 실행: $env:LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED="true"; $env:LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT="C:\workspace\gpr_detection\data"; conda run -n gpr-label label-studio start
name: gpr-label
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - pip:
      - label-studio==1.23.2
