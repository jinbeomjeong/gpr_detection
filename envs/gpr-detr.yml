# gpr-detr: Apache-2.0 검출기 이전 실험용 env (cv-detection-expert). ultralytics를 넣지 않는다.
# 근거: docs/research/packages_agents.md (2026-10-29)
# 생성: conda env create -f envs/gpr-detr.yml
name: gpr-detr
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - numpy>=2.2
  - scipy>=1.15
  - pillow>=12.3
  - pyarrow>=15                   # vernier(rfdetr train) 의존
  - pandas>=2.2
  - matplotlib>=3.9
  - tensorboard>=2.21
  - pyyaml>=6.0.2
  - tqdm>=4.66
  - pytest>=8.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1+cu130
      - torchvision==0.29.1+cu130
      - rfdetr[train]==1.11.2     # N/S/M/L만 사용 (XL·2XL은 PML 1.0). train extra 내부 고정 때문에 버전 고정
      - transformers>=5.1,<6      # RT-DETRv2 / D-FINE (COCO 가중치만)
      - torchmetrics>=1.8.2,<1.9  # rfdetr[train]과 맞춤
      - faster-coco-eval>=1.8
      - opencv-python-headless>=4.10,<5   # cv2는 이것 하나만 (roboflow가 headless를 요구)
